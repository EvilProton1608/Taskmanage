services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the shell or server environment}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random secret}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PORT: 5000
      UPLOAD_DIR: /app/server/uploads
    ports:
      - "5000:5000"
    volumes:
      - taskmanage-uploads:/app/server/uploads
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: ../Dockerfile.client
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  taskmanage-uploads:
